<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip path to hide lines outside the circle -->
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="180"/>
    </clipPath>
  </defs>
  
  <!-- Circle background -->
  <circle cx="200" cy="200" r="180" fill="#2D3132"/>
  
  <!-- Lines group with clip path -->
  <g clip-path="url(#circleClip)">
    <!-- Connection lines - 2-3 background-sub line (drawn first, so it's behind) -->
    <line x1="287.46" y1="131.24" x2="112.54" y2="268.76" stroke="#494F50" stroke-width="9.06" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Connection lines - 1-3 and 1-4 primary lines (drawn last, so they're in front) -->
    <line x1="112.54" y1="131.24" x2="112.54" y2="268.76" stroke="#E4E6E7" stroke-width="14.66" stroke-linecap="round" opacity="0.95"/>
    <line x1="112.54" y1="131.24" x2="287.46" y2="268.76" stroke="#E4E6E7" stroke-width="14.66" stroke-linecap="round" opacity="0.95"/>
  </g>
  
  <!-- Nodes (dots) -->
  <!-- 1: primary (top-left) -->
  <circle cx="112.54" cy="131.24" r="38.4" fill="#E4E6E7"/>
  
  <!-- 2: secondary (top-right) -->
  <circle cx="287.46" cy="131.24" r="23.76" fill="#798386"/>
  
  <!-- 3: primary (bottom-left) -->
  <circle cx="112.54" cy="268.76" r="38.4" fill="#E4E6E7"/>
  
  <!-- 4: accent (bottom-right) -->
  <circle cx="287.46" cy="268.76" r="30.96" fill="#C6D6DA"/>
</svg>